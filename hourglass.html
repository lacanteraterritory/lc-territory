async function open(keyBytes, box) {           // verify HMAC, then AES-CBC decrypt; null if the key does not fit
  const iv = hex2b(box.iv), ct = b642b(box.ct);
  const hk = await crypto.subtle.importKey("raw", keyBytes, {name: "HMAC", hash: "SHA-256"}, false, ["verify"]);
  const joined = new Uint8Array(iv.length + ct.length); joined.set(iv); joined.set(ct, iv.length);
  if (!(await crypto.subtle.verify("HMAC", hk, hex2b(box.mac), joined))) return null;
  const ak = await crypto.subtle.importKey("raw", keyBytes, {name: "AES-CBC"}, false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name: "AES-CBC", iv}, ak, ct));
}
async function unlock(pk) {                     // returns true when this key opens the page
  for (const w of CFG.wrappers) {
    const p = await open(pk, w);
    if (!p) continue;
    const payload = JSON.parse(DEC.decode(p));
    const html = await open(hex2b(payload.k), CFG.content);
    if (!html) continue;
    render(DEC.decode(html), payload);
    return true;
  }
  return false;
}
function render(html, payload) {
  window.LC_TIER = payload.tier; window.LC_NAV = payload.nav; window.LC_PAGE = CFG.page;
  document.open(); document.write(html); document.close();
  const fill = () => {
    const nav = document.getElementById("lc-nav"); if (!nav) return;
    const lang = (document.documentElement.lang || "es").slice(0, 2) === "en" ? "en" : "es";
    nav.innerHTML = payload.nav.map(n => `<a href="${n.href}"${n.href === CFG.page ? ' class="active" aria-current="page"' : ""}>${n[lang]}</a>`).join("");
  };
  window.LC_FILL_NAV = fill;
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fill); else setTimeout(fill, 0);
}
function remember(pk) {
  try { localStorage.setItem(KEYNAME, JSON.stringify({k: b2hex(pk), exp: Date.now() + CFG.rememberDays * 864e5})); } catch (e) {}
}
function stored() {
  try { const s = JSON.parse(localStorage.getItem(KEYNAME) || "null"); return s && s.exp > Date.now() ? hex2b(s.k) : null; } catch (e) { return null; }
}
function showLock(note) {
  document.getElementById("lc-loading").classList.add("hidden");
  document.getElementById("lc-lock").classList.remove("hidden");
  if (note) { const n = document.getElementById("lc-note"); n.textContent = note; n.classList.remove("hidden"); }
  document.getElementById("lc-pw").focus();
}
window.addEventListener("load", async () => {
  const pk = stored();
  if (pk && await unlock(pk)) return;
  showLock(pk ? "Esta sección es para los ancianos · This section is for the elders" : "");
});
document.getElementById("lc-f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = document.getElementById("lc-err"); err.textContent = "";
  const btn = ev.target.querySelector(".lc-btn"); btn.disabled = true;
  try {
    const pk = await derive(document.getElementById("lc-pw").value);
    if (await unlock(pk)) { remember(pk); return; }
    err.textContent = "Contraseña incorrecta · Wrong password";
  } finally { btn.disabled = false; }
});
